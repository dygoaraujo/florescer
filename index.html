<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Sem zoom: ele tem que se comportar como app, não como página. Isto aqui
     resolve no Android e nos outros navegadores; o Safari do iPhone ignora
     `user-scalable` desde o iOS 10, e lá quem barra a pinça é o bloqueio de
     `gesturestart` em core.js. O zoom por duplo toque e o de foco em campo já
     caem por `touch-action:manipulation` e por campos com fonte de 16px.
     O zoom do sistema (Ajustes → Acessibilidade) continua funcionando. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Florescer</title>
<meta name="description" content="Companheiro diário do tratamento.">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#FDFBFC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Florescer">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<main id="app">
  <section class="tela ativa" id="tela-hoje"></section>
  <section class="tela" id="tela-alimentacao"></section>
  <section class="tela" id="tela-progresso"></section>
  <section class="tela" id="tela-agenda"></section>
  <section class="tela" id="tela-ajustes"></section>
</main>

<nav id="tabbar">
  <div class="tabbar-in">
    <button class="tab ativa" data-tela="hoje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2c2.6 1.9 4 4.2 4 6.6a4 4 0 0 1-8 0c0-2.4 1.4-4.7 4-6.6z"/><path d="M12 13.8V21"/><path d="M12 17.6c-1.6-1.5-3.4-2-5.4-1.7.3 1.9 1.4 3.1 3.2 3.5"/></svg>
      <span>Hoje</span>
    </button>
    <button class="tab" data-tela="alimentacao">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5h11a2 2 0 0 1 2 2v15a2 2 0 0 0-2-2h-11z"/><path d="M5.5 3.5a1.8 1.8 0 0 0-1.8 1.8v13.4A1.8 1.8 0 0 0 5.5 20.5"/><path d="M9 8h5.5M9 11.5h5.5"/></svg>
      <span>Diário</span>
    </button>
    <button class="tab" data-tela="progresso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7.5 15.5l3.5-4 3 2.5 5-6.5"/></svg>
      <span>Progresso</span>
    </button>
    <button class="tab" data-tela="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Agenda</span>
    </button>
    <button class="tab" data-tela="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .35 1.9l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.9-.35 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.12a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.9.35l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .35-1.9 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.12a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.35-1.9l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.9.35H9.1a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.12a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.9-.35l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.35 1.9V9.1a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.12a1.7 1.7 0 0 0-1.48 1.03z"/></svg>
      <span>Ajustes</span>
    </button>
  </div>
</nav>

<div id="veu"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div id="toasts" aria-live="polite"></div>

<div id="confirma" role="dialog" aria-modal="true">
  <div class="confirma-cx">
    <h3 id="confirma-titulo"></h3>
    <p id="confirma-texto"></p>
    <p id="confirma-aviso" class="confirma-aviso"></p>
    <div class="confirma-btns">
      <button class="btn btn-vazio" onclick="fecharConfirma(false)">Cancelar</button>
      <button class="btn btn-cheio" id="confirma-ok" onclick="fecharConfirma(true)">Confirmar</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/hoje.js"></script>
<script src="js/alimentacao.js"></script>
<script src="js/progresso.js"></script>
<script src="js/relatorio.js"></script>
<script src="js/agenda.js"></script>
<script src="js/ajustes.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
